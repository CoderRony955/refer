<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Meme Console</title>
  <link rel="stylesheet" href="../static/memefun.css">
</head>
<body>

<div class="meme-app">

  <header class="meme-header">
    <div class="meme-logo">😂</div>
    <h1>Meme Terminal</h1>
    <span>memes · chaos · fun</span>
  </header>

  <section class="meme-banner">
    <div class="sticker">LOL</div>
    <div class="sticker">BRUH</div>
    <div class="sticker">404 BRAIN</div>
    <div class="sticker">SEND HELP</div>
  </section>

  <section class="meme-output">

    <div class="output-title">🔥 what just happened?</div>

    <pre class="meme-message">
{{ message }}
    </pre>

  </section>

  <footer class="meme-footer">

    <div class="meme-status">
      mood: unhinged · status: still works
    </div>

    <a href="{{ shareable_folder }}" target="_blank" class="meme-btn">
      Download The Chaos
    </a>

  </footer>

</div>

</body>
</html>
