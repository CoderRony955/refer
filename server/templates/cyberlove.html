<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CyberSec Console</title>
  <link rel="stylesheet" href="../static/cyberlove.css" />
</head>
<body>

  <div class="console">

    <header class="topbar">
      <div class="left">
        <span class="signal"></span>
        <span class="title">CYBERSEC MONITOR — SECURE NODE 07</span>
      </div>
      <div class="right">
        <span class="status online">ONLINE</span>
      </div>
    </header>

    <section class="terminal">

      <div class="line">
        <span class="label">system@node07:</span>
        <span class="cmd">~$ initialize secure session</span>
      </div>

      <div class="output">
        ✔ Threat intelligence loaded<br>
        ✔ Encrypted channel established<br>
        ✔ Firewall rules synced
      </div>

      <div class="json">
        <span class="key">"message"</span> :
        <span class="value">"{{ message }}"</span>
      </div>

      <div class="hint">
        // You can now download the secure packages below
      </div>

    </section>

    <footer class="actions">
      <div class="env">
        ● environment : stable
      </div>

      <a class="secure-btn" href="{{ shareable_folder }}" target="_blank">
        Download Secure Packages
      </a>
    </footer>

  </div>

</body>
</html>
