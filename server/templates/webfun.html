<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebFun Studio</title>
  <link rel="stylesheet" href="../static/webfun.css">
</head>
<body>

<div class="webfun-window">

  <header class="browser-bar">
    <div class="browser-dots">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
    </div>

    <div class="address-bar">
      https://webfun.studio/play
    </div>
  </header>

  <section class="hero">

    <div class="hero-left">
      <h1>Build the Web. Have Fun.</h1>
      <p>
        Design, animate and ship beautiful web experiences —
        one playful idea at a time.
      </p>
    </div>

    <div class="hero-right">
      <div class="bubble">HTML</div>
      <div class="bubble">CSS</div>
      <div class="bubble">JS</div>
      <div class="bubble">UI</div>
    </div>

  </section>

  <section class="webfun-console">
    <div class="console-head">preview.log</div>

    <pre class="console-body">
{{ message }}
    </pre>
  </section>

  <footer class="webfun-footer">
    <span class="status">🌍 web mode active</span>

    <a href="{{ shareable_folder }}" target="_blank" class="download">
      Download Web Assets
    </a>
  </footer>

</div>

</body>
</html>
